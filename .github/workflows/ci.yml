name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEV_MODE: mock
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: node --test .github/scripts/merge-readiness.test.cjs

  merge_ready:
    name: Merge readiness
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify merge prerequisites
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const { evaluate } = require('./.github/scripts/merge-readiness.cjs');
            const result = evaluate({
              event: process.env.EVENT_NAME,
              tests: process.env.TEST_RESULT
            });
            core.summary.addHeading('Merge readiness').addRaw(result.reason);
            await core.summary.write();
            if (!result.ok) core.setFailed(result.reason);
